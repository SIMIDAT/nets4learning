name: 'Checks'

# Lint, tipos, tests unitarios (vitest) y pruebas en el navegador (Playwright). Se lanzan en cada pull request y,
# antes de publicar, desde deploy.yaml: si algo falla, no se despliega.
on:
  pull_request:
  workflow_call:

jobs:
  static:
    name: 'Lint, tipos y tests unitarios'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      # La versión de pnpm se toma de "packageManager" en package.json (pnpm 12).
      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm exec tsc -b
      - run: pnpm exec vitest run

  e2e:
    name: 'Pruebas en el navegador (Playwright)'
    runs-on: ubuntu-24.04
    # Entrenar las tres tareas con WebGL por software lleva unos minutos
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium

      # playwright.config.ts construye la versión de Netlify y la sirve con `vite preview`
      - run: pnpm test:e2e
        env:
          NODE_OPTIONS: "--max_old_space_size=6144"

      # Informe con capturas y trazas de las pruebas que fallen
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 14
