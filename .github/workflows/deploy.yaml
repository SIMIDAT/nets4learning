name: 'Deploy'

on:
  push:
    tags:
      - 'v*'

jobs:
  deploy-stable:
    name: 'Deploy to netlify stable'
    runs-on: ubuntu-24.04
    steps:
      - name: 'Create env file'
        run: |
          echo "${{ vars.NETLIFY_ENV_FILE_STABLE }}" > .env.netlify
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      # La versión de pnpm se toma de "packageManager" en package.json (pnpm 12).
      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - uses: jsmrcaga/action-netlify-deploy@v2.4.0
        with:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID_STABLE }}
          NETLIFY_DEPLOY_MESSAGE: "Deploy v${{ github.ref }}"
          NETLIFY_DEPLOY_TO_PROD: true
          # NODE_ENV=production (abajo) haría que pnpm omitiera las devDependencies (vite, typescript…)
          # que necesita el build: --production=false las instala igualmente.
          INSTALL_COMMAND: pnpm install --frozen-lockfile --production=false
          BUILD_COMMAND: pnpm run build:netlify
          # Vite genera el build en dist/ (no en build/, que era la carpeta de Create React App).
          BUILD_DIRECTORY: 'dist'
        env:
          CI: false
          NODE_OPTIONS: "--max_old_space_size=6144"
          NODE_ENV: "production"
          PUBLIC_URL: "https://nets4learning.netlify.app"
          VITE_ENVIRONMENT: "production"
          VITE_PATH: ""
          VITE_PUBLIC_URL: "https://nets4learning.netlify.app"
          VITE_GA_MEASUREMENT_ID: "G-3644EFBXMG"
          VITE_SHOW_NEW_FEATURE: "false"
