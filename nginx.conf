server {
    # Traefik conecta a este contenedor por su nombre en el puerto 80
    # (services.n4l-svc.loadBalancer.servers -> http://n4l:80 en el traefik.yml,
    # que no se puede modificar), así que aunque la imagen sea nginx-unprivileged
    # nginx debe escuchar aquí en el 80 (requiere cap_add NET_BIND_SERVICE).
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    location = / {
        return 301 /n4l/;
    }

    # La app se sirve bajo /n4l/ (dist copiado a /usr/share/nginx/html/n4l/,
    # coincide con VITE_PATH). El fallback de rutas del SPA debe apuntar al
    # index.html de esa subruta: si no, cualquier recarga de una ruta anidada
    # cae al index.html de la raíz (la página de bienvenida por defecto de nginx).
    location /n4l/ {
        try_files $uri $uri/ /n4l/index.html;
    }

    # Cache static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg)$ {
        expires 1y;
        add_header Cache-Control "public, no-transform";
    }
}
