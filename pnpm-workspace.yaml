# El proyecto usa pnpm 12 ("packageManager" en package.json; el CI toma la versión de ahí).
# Scripts de build de dependencias permitidos (pnpm ≥ 11 los bloquea por defecto).
# - esbuild: NECESARIO, descarga el binario nativo que usa Vite.
# - El resto son postinstall cosméticos (mensajes de financiación o, en @tsparticles/engine,
#   recomendaciones de wrappers para cada framework) o builds
#   nativos no necesarios para la app en navegador, por lo que se omiten.
allowBuilds:
  '@tensorflow/tfjs-node': false
  '@tsparticles/engine': false
  core-js: false
  es5-ext: false
  esbuild: true
  preact: false
# Permite dependencias resueltas por URL en subdependencias.
# Necesario porque danfojs depende de xlsx servido desde el CDN de SheetJS
# (https://cdn.sheetjs.com/...), que pnpm ≥ 11 bloquea por defecto (blockExoticSubdeps).
blockExoticSubdeps: false
# Paquetes que se pueden instalar aunque se acaben de publicar (pnpm espera un tiempo mínimo desde su publicación):
# handsign-multilingual es nuestro (https://github.com/nonodev96/handsign-multilingual): todas sus versiones.
minimumReleaseAgeExclude:
  - handsign-multilingual
# danfojs 1.2 declara @tensorflow/tfjs ^3 y mathjs 9.4.4; los forzamos a las versiones del proyecto
# para que solo haya una copia de cada una (ver el alias de "danfojs" en vite.config.ts).
# De mathjs, danfojs solo usa mean, median, mode, std y variance, que no cambian entre la 9 y la 12.
# mathjs 12 ya no trae las anotaciones /* #__PURE__ */ mal colocadas de la 11, por las que Rollup avisaba al construir.
overrides:
  'danfojs>@tensorflow/tfjs': ^4.22.0
  'danfojs>mathjs': ^12.4.3
# face-api lee los resultados de cada detección con dataSync()/arraySync() (el NMS de SSD MobileNet hacía un
# arraySync() por cada pareja de cajas). Con WebGPU cada lectura síncrona detiene la GPU y se hace copiando a
# canvas: la página de FACE-API iba muy lenta. El parche cambia su código fuente (src/) para usar data()/array();
# la app compila face-api desde ese código (alias en vite.config.ts), no usa dist/. Las detecciones no cambian.
# Al actualizar face-api hay que rehacer el parche.
# tfjs-backend-webgl: el shader de log() devuelve NaN con la constante 0./0.; Firefox en Linux traduce los shaders a
# GLSL 1.50 y la escribe como uintBitsToFloat(), que el driver de NVIDIA no compila ("Failed to compile fragment shader"
# al entrenar clasificadores con WebGL: la entropía cruzada usa log()). El parche usa el uniform NAN, que TF.js ya pone
# a NaN en todos los shaders. Al actualizar TF.js hay que comprobar si sigue haciendo falta.
patchedDependencies:
  '@tensorflow/tfjs-backend-webgl@4.22.0': patches/@tensorflow__tfjs-backend-webgl@4.22.0.patch
  '@vladmandic/face-api@1.7.15': patches/@vladmandic__face-api@1.7.15.patch
