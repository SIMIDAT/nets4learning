<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Vite añade el `base` (p. ej. /n4l/) a las rutas absolutas de `public/`. -->
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="apple-touch-icon" href="/logo192.png" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#1f1a7a" />
    <meta name="description" content="Nets4Learning: aprende inteligencia artificial entrenando y explicando redes neuronales en el navegador." />
    <title>Nets4Learning</title>
    <script>
      // El tema antes de pintar nada, como detectTheme() de src/core/theme.ts (que lo vuelve a aplicar al arrancar):
      // así el indicador de carga y la página no se ven un instante en claro con el tema oscuro
      try {
        var saved = localStorage.getItem('theme')
        var theme = saved === 'dark' || saved === 'light' ? saved : (window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light')
        document.documentElement.setAttribute('data-bs-theme', theme)
        document.documentElement.setAttribute('data-theme', theme)
      } catch (error) {}
      // Los ajustes de accesibilidad de /settings (tamaño del texto, espaciado…), como applyDisplaySettings() de
      // src/core/a11y/displaySettings.ts: así la página no se ve un instante con el texto pequeño
      try {
        var display = JSON.parse(localStorage.getItem('n4l-display') || '{}') || {}
        var root = document.documentElement
        if ([125, 150, 200].indexOf(display.textSize) !== -1) root.setAttribute('data-n4l-text-size', String(display.textSize))
        if (display.spacing === true) root.classList.add('n4l-text-spacing')
        if (display.highContrast === true || (window.matchMedia && matchMedia('(prefers-contrast: more)').matches)) root.classList.add('n4l-high-contrast')
        if (display.reduceMotion === true) root.classList.add('n4l-reduce-motion')
        if (display.underlineLinks === true) root.classList.add('n4l-underline-links')
        if (display.strongFocus === true) root.classList.add('n4l-strong-focus')
      } catch (error) {}
      // El idioma, como detectLanguage() de src/core/i18n/language.ts (i18n lo vuelve a poner al arrancar): el guardado o
      // el primero del navegador que esté traducido. Así el lector de pantalla no empieza a leer en inglés (WCAG 3.1.1)
      try {
        var languages = ['en', 'es', 'ja']
        var savedLanguage = null
        try { savedLanguage = localStorage.getItem('language') } catch (error) {}
        var candidates = [savedLanguage].concat(navigator.languages && navigator.languages.length ? navigator.languages : [navigator.language])
        for (var i = 0; i < candidates.length; i++) {
          var base = candidates[i] ? String(candidates[i]).toLowerCase().split('-')[0] : ''
          if (languages.indexOf(base) !== -1) { document.documentElement.lang = base; break }
        }
      } catch (error) {}
    </script>
    <style>
      /* Indicador de carga mientras llega la aplicación (React lo sustituye al pintarla): sin Bootstrap, que aún no ha
         llegado */
      .n4l-boot {
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 1rem;
        font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
        color: #212529;
        background-color: #fff;
      }
      [data-bs-theme="dark"] .n4l-boot {
        color: #dee2e6;
        background-color: #212529;
      }
      .n4l-boot-spinner {
        width: 2rem;
        height: 2rem;
        border: .25rem solid currentColor;
        border-right-color: transparent;
        border-radius: 50%;
        opacity: .6;
        animation: n4l-boot-spin .75s linear infinite;
      }
      @keyframes n4l-boot-spin {
        to { transform: rotate(360deg); }
      }
      @media (prefers-reduced-motion: reduce) {
        .n4l-boot-spinner { animation-duration: 2s; }
      }
    </style>
  </head>
  <body>
    <noscript>Nets4Learning necesita JavaScript para funcionar.</noscript>
    <div id="root">
      <div class="n4l-boot" role="status" aria-live="polite">
        <img src="/logo-64.png" width="64" height="64" alt="" />
        <div class="n4l-boot-spinner"></div>
        <span>Nets4Learning</span>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
